<a class="skip" href="#main">{{ 'nav.skip' | t }}</a>

<header class="bar">
  <a class="brand" routerLink="/" [attr.aria-label]="'app.name' | t">
    <span class="mark" aria-hidden="true">◈</span>
    <span class="name">{{ 'app.name' | t }}</span>
  </a>
  <nav class="tools" aria-label="Preferences">
    <button type="button" class="btn ghost" (click)="i18n.toggle()" [attr.aria-label]="'nav.language' | t">
      {{ i18n.lang() === 'en' ? 'عربي' : 'EN' }}
    </button>
    <button type="button" class="btn ghost" (click)="themeService.toggle()" [attr.aria-label]="'nav.theme' | t">
      {{ themeService.theme() === 'dark' ? '☀' : '☾' }}
    </button>
  </nav>
</header>

<main id="main" tabindex="-1">
  <router-outlet />
</main>

<app-toast-outlet />
